[pytest]
testpaths = tests
pythonpath = .
markers =
    gate: uses benchmark board copies
    scaling: runtime growth checks
    mechfix: mechanism fixtures routed end to end (tests/test_mechfix.py)
    gui: live KiCad 10 on Xephyr (tests/test_gui_e2e.py, tools/gui_e2e.sh)
addopts = -m "not gate and not scaling and not mechfix and not gui"
