[package]
name = "topor-engine"
version = "0.2.0"
edition = "2021"

[lib]
name = "topor_engine"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
spade = "2.15.1"
pyo3 = { version = "0.23", features = ["abi3-py39", "extension-module"], optional = true }

[dev-dependencies]
proptest = "1"

[features]
python = ["dep:pyo3"]
